name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
      - v2 # Monitora anche il branch v2
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }}
  BACKEND_IMAGE_NAME: ${{ vars.BACKEND_IMAGE_NAME || 'dose-backend' }}
  FRONTEND_IMAGE_NAME: ${{ vars.FRONTEND_IMAGE_NAME || 'dose-frontend' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- METADATI BACKEND ---
      - name: Extract Docker metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      # 1. Build & Push Backend (.NET 10)
      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- METADATI FRONTEND ---
      - name: Extract Docker metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      # 2. Build & Push Frontend (React + NGINX)
      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_BASE_URL=${{ vars.VITE_BASE_URL || '/' }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '' }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'Dose - Bar & Drinking Tracker' }}
            VITE_APP_SHORT_NAME=${{ vars.VITE_APP_SHORT_NAME || 'Dose' }}
            VITE_APP_DESCRIPTION=${{ vars.VITE_APP_DESCRIPTION || 'Track drinks, measure BAC realtime, and discover craft cocktail recipes.' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
